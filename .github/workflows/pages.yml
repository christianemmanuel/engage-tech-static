# Deploy the static preview to GitHub Pages.
# The site's source uses root-relative URLs (what WordPress needs);
# tools/deploy-ghpages.py rewrites them to the /<repo>/ base path and adds
# a noindex meta so this preview never competes with the production domain.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild pages from src (guards against stale committed output)
        run: python3 tools/build.py

      - name: Produce dist/ with the /<repo>/ base path
        run: python3 tools/deploy-ghpages.py "/${{ github.event.repository.name }}"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
